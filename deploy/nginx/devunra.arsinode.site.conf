server {
    listen 80;
    listen [::]:80;
    server_name devunra.arsinode.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/devunra.arsinode.site/acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://devunra.arsinode.site$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name devunra.arsinode.site;
    root /var/www/devunra.arsinode.site/current;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/devunra.arsinode.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/devunra.arsinode.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    include /etc/nginx/arsinode.site/cloudflare-realip.conf;

    access_log /var/log/nginx/devunra.arsinode.site.access.log;
    error_log /var/log/nginx/devunra.arsinode.site.error.log;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/devunra.arsinode.site/acme;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /img/ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
