name: Transfer verified Windows release asset

on:
  workflow_dispatch:
    inputs:
      asset_name:
        description: Accepted Windows artifact filename
        type: choice
        options:
          - DEVUNRA-Setup-1.3.0.exe
          - DEVUNRA-1.3.0-win-x64.zip
        required: true
      asset_bytes:
        description: Accepted asset size in bytes
        type: string
        required: true
      asset_sha256:
        description: Accepted asset SHA-256
        type: string
        required: true
      archive_bytes:
        description: Actions outer ZIP size in bytes
        type: string
        required: true
      archive_sha256:
        description: Actions outer ZIP SHA-256
        type: string
        required: true
      publish:
        description: Publish after verification (only after Windows acceptance passes)
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: transfer-windows-release-v1.3.0
  cancel-in-progress: false

jobs:
  transfer:
    if: github.repository == 'Intra-Sepriansa/devunra' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # GitHub's artifact download redirect expires after one minute. Retrieve it
      # immediately before setting the ephemeral secret and dispatching this job.
      # https://docs.github.com/en/rest/actions/artifacts#download-an-artifact
      - name: Download and verify the approved archive before checkout
        env:
          TRANSFER_URL: ${{ secrets.RELEASE_TRANSFER_URL }}
          EXPECTED_BYTES: ${{ inputs.archive_bytes }}
          EXPECTED_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, re, sys, urllib.parse, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'accepted-release-archive.zip'
          try:
              url = os.environ['TRANSFER_URL']
              parsed = urllib.parse.urlsplit(url)
              if (parsed.scheme != 'https' or not (parsed.hostname or '').endswith('.blob.core.windows.net')
                  or parsed.username or parsed.password or parsed.port not in (None, 443) or parsed.fragment):
                  raise ValueError()
              count = int(os.environ['EXPECTED_BYTES'])
              expected = os.environ['EXPECTED_SHA256']
              if not 0 < count <= 4 * 1024**3 or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise ValueError()
              digest = hashlib.sha256()
              copied = 0
              request = urllib.request.Request(url, headers={'Accept': 'application/zip'})
              with urllib.request.build_opener(NoRedirect).open(request, timeout=120) as source, open(target, 'xb') as output:
                  if source.status != 200:
                      raise ValueError()
                  for block in iter(lambda: source.read(1024 * 1024), b''):
                      copied += len(block)
                      if copied > count:
                          raise ValueError()
                      digest.update(block)
                      output.write(block)
              if copied != count or digest.hexdigest() != expected:
                  raise ValueError()
              print('Approved Actions archive downloaded; exact size and SHA-256 verified.')
          except Exception:
              target.unlink(missing_ok=True)
              print('Archive download failed or did not match approved metadata. Refresh the short-lived secret and dispatch a new run; private URL details omitted.', file=sys.stderr)
              sys.exit(1)
          PY

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify the selected Windows file and optionally upload without replacement
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: ${{ inputs.asset_name }}
          ASSET_BYTES: ${{ inputs.asset_bytes }}
          ASSET_SHA256: ${{ inputs.asset_sha256 }}
          ARCHIVE_BYTES: ${{ inputs.archive_bytes }}
          ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          args=()
          if [[ "$PUBLISH" == 'true' ]]; then args+=(--publish); fi
          python3 scripts/release-transfer.py \
            --archive "$RUNNER_TEMP/accepted-release-archive.zip" \
            --destination "$RUNNER_TEMP/verified-windows-release" \
            --asset-name "$ASSET_NAME" --asset-bytes "$ASSET_BYTES" --asset-sha256 "$ASSET_SHA256" \
            --archive-bytes "$ARCHIVE_BYTES" --archive-sha256 "$ARCHIVE_SHA256" "${args[@]}"

      - name: Remove temporary transfer content
        if: always()
        run: |
          rm -f -- "$RUNNER_TEMP/accepted-release-archive.zip"
          rm -rf -- "$RUNNER_TEMP/verified-windows-release"
